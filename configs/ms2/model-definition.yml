---
embedder:
  token_embedding_dim: 128

rnn_branch_1:
  pooling_activation: "tanh"
  dropout: 0.2
  output_dim: 96

rnn_branch_2:
  dropout_embedding: 0.2
  dropout_rnn: 0.3
  output_dim: 96

rnn_branch_3:
  token_cnn_dim: 64
  token_cnn_kernel_sizes: [2, 3, 4]
  token_cnn_activation: "relu"
  dropout_embedding: 0.2
  output_dim: 96

rnn_gated_merge:
  fusion_dim: 192
  dropout_ff: 0.3
  mean_merge: false

rnn_film:
  hidden_dim: 128

rnn_decoder:
  decoder_dim: 256
  dropout_embedding: 0.2
  dropout_rnn: 0.3
  use_film: true

rnn_training:
  pad_id: 0
  label_smoothing: 0.1
  peak_lr: 3.0e-4
  min_lr: 1.0e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  global_clipnorm: 1.0
  beta_1: 0.9
  beta_2: 0.98
  epsilon: 1.0e-9
  batch_size: 8
  epochs: 2
