[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentencepiece>=0.2.1",
    "tqdm>=4.67.1",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.2",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ms1 = "src.cli.ms1:main"
ms2 = "src.cli.ms2:main"
ms3 = "src.cli.ms3:main"

[tool.setuptools]
packages = [
    "src",
    "src.cli",
    "src.common",
    "src.ms1",
    "src.ms1.cleaning",
    "src.ms1.normalization",
    "src.ms1.spelling",
    "src.ms1.ingest",
    "src.ms2",
    "src.ms2.analysis",
    "src.ms2.data",
    "src.ms2.inference",
    "src.ms2.metrics",
    "src.ms2.models",
    "src.ms2.models.rnn",
    "src.ms2.models.transformer",
    "src.ms2.training",
    "src.ms3",
    "src.ms3.retrieval",
    "src.ms3.generation",
    "src.ms3.app",
    "src.ms3.evaluation",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["E402"]
"tests/ms2/test_model_a_branches.py" = ["E402"]
"tests/ms2/test_model_a_middle.py" = ["E402"]
"tests/ms2/test_model_a_full.py" = ["E402"]
"tests/ms2/test_rope.py" = ["E402"]
"tests/ms2/test_transformer_attention.py" = ["E402"]
"tests/ms2/test_transformer_encoder.py" = ["E402"]
"tests/ms2/test_model_b_full.py" = ["E402"]
